[paths]
# Base directory for CADIP scripts and data
cadip_base = /home/meos/bin/cadip

# Working directories
in_dir = %(cadip_base)s/IN
md5_dir = %(cadip_base)s/MD5
sent_files_dir = %(cadip_base)s/Sent_DDP
bad_from_ddp_dir = %(cadip_base)s/BAD_From_DDP
ftp_results_dir = %(cadip_base)s/ftp-results
