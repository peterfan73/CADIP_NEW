# File to track processed folders (auto-cleaned after 3 days)
processed_file = /home/meos/bin/cadip/processed_folders.txt
# Station identifier for the EOF filename
station_id = MPS

[remote]
# Remote directory template — {unit} is replaced by the DFEP processing unit (1-9)
target_path_template = WebReports/DFEP{unit}/
